<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Craiova Parking Watch</title><link rel="stylesheet" href="popup.css"><script defer src="model.js"></script><script defer src="popup.js"></script></head><body><header><h1>Parking Watch</h1><button id="refresh">Refresh</button></header><p class="muted">Craiova · residential parking inventory</p><div class="settings"><label>Property<select id="property"><option value="">No verified property</option></select></label><label>Refresh<select id="interval"><option value="1">1 minute</option><option value="2">2 minutes</option><option value="5">5 minutes</option><option value="10">10 minutes</option></select></label><label>Radius<select id="radius"><option value="30">30 m</option><option value="50">50 m</option><option value="100">100 m</option></select></label></div><div id="status" role="status"></div><div id="filters" class="settings"><label>Find a space<input id="search" type="search" placeholder="Space number or lot name"></label><label>Show<select id="scope"><option value="all">All spaces</option><option value="scheduled">Scheduled auctions</option><option value="watched">Watched spaces</option><option value="mine">My open applications</option></select></label></div><section id="content"></section><footer>Shows portal inventory and reported demand, not physical vehicle occupancy. <a href="https://parcari-ticketing.primariacraiova.ro/" target="_blank">Open portal</a></footer></body></html>
